<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socials | BLK Coffee</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="socials-page-bg">

    <div class="fullscreen-video-wrap">
        <video autoplay muted loop playsinline>
            <source src="backgroundvideo3.mp4" type="video/mp4">
        </video>
    </div>

    <header class="main-header">
        <div class="container header-content">
            <a href="index.html" class="logo-link">
                <img src="logo.png" alt="BLK Coffee Logo" class="main-logo">
            </a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="about.html" class="nav-link">About Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="socials-content">
        <div class="banner-container1"></div>
        
        <div class="socials-grid">
            <a href="https://www.instagram.com/qahwablk/?hl=en" target="_blank" class="social-card instagram">
                <span class="social-name">Instagram</span>
                <span class="social-handle">@qahwablk</span>
            </a>
            <a href="https://www.tiktok.com/@yourhandle" target="_blank" class="social-card tiktok">
                <span class="social-name">TikTok</span>
                <span class="social-handle">@qahwablk</span>
            </a>
            <a href="https://www.facebook.com/QahwaBLK/" target="_blank" class="social-card facebook">
                <span class="social-name">Facebook</span>
                <span class="social-handle">Qahwa BLK</span>
            </a>
            <a href="https://blk.jo/contact-us/" class="social-card email">
                <span class="social-name">Contact Us</span>
                <span class="social-handle">Here!</span>
            </a>
        </div>
    </main>

    <div class="back-btn-container">
        <button onclick="window.history.length > 1 ? history.back() : window.location.href='index.html';" class="back-button">
            ← BACK
        </button>
    </div>

    <footer class="main-footer">
        <div class="container footer-content">
            <h3>© 2026 BLK Coffee (Jordan)</h3>
        </div>
    </footer>
   
</body>
</html>
