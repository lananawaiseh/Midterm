<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Drops | BLK Coffee</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="video-bg-page">

    <div class="fullscreen-video-wrap">
        <video autoplay muted loop playsinline>
            <source src="backgroundvideo2.mp4" type="video/mp4">
        </video>
    </div>

    <header class="main-header">
        <div class="container header-content">
            <a href="index.html" class="logo-link">
                <img src="logo.png" alt="BLK Coffee Logo" class="main-logo">
            </a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="about.html" class="nav-link">About Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content" id="new-drops-page">
        <div class="container">
            
            <section class="about-content" style="margin-top: 3rem; margin-bottom: 3rem; text-align: center;">
               <h2 class="hero-title">FRESH DROPS</h2>
                <br>
                <span style="color: #ffef63; font-weight: 800; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; display: block; margin-bottom: 10px;"> Coffee, Food and Merch</span>
            </section>

            <section class="merch-grid-section">
                <div class="merch-grid">
                    
                    <article class="merch-card">
                        <div class="merch-image-placeholder" style="background-image: url('blkimages/drop1.png');"></div>
                        <div class="merch-info">
                            <h3 class="merch-name blk-title-font">Pumpkin Crumble Muffin</h3>
                        </div>
                    </article>

                    <article class="merch-card">
                        <div class="merch-image-placeholder" style="background-image: url('blkimages/drop2.png');"></div>
                        <div class="merch-info">
                            <h3 class="merch-name blk-title-font">BLK Water Bottles</h3>
                        </div>
                    </article>

                    <article class="merch-card">
                        <div class="merch-image-placeholder" style="background-image: url('blkimages/drop3.png');"></div>
                        <div class="merch-info">
                            <h3 class="merch-name blk-title-font">Khalta Hazelnut 340g</h3>
                        </div>
                    </article>

                    <article class="merch-card">
                        <div class="merch-image-placeholder" style="background-image: url('blkimages/drop4.png');"></div>
                        <div class="merch-info">
                            <h3 class="merch-name blk-title-font">Coffee Bean 250g</h3>
                        </div>
                    </article>

                </div>
            </section>
        </div>
    </main>

    <div class="back-btn-container">
        <button onclick="history.back()" class="back-button">← BACK</button>
    </div>

    <footer class="main-footer">
        <div class="container footer-content">
            <h3>© 2026 BLK Coffee (Jordan)</h3>
        </div>
    </footer>
   
</body>
</html>
